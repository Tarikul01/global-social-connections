{{define "partials/nav.html"}}
<nav class="bg-white border-b border-slate-200 sticky top-0 z-50">
  <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
    <a href="/dashboard" class="font-bold text-indigo-600 text-lg">FindNeighbour</a>
    <span class="hidden sm:inline text-xs text-slate-400 ml-1">GSC</span>
    <div class="flex gap-4 text-sm">
      <a href="/discover" class="hover:text-indigo-600">Discover</a>
      <a href="/events" class="hover:text-indigo-600">Events</a>
      <a href="/messages" class="hover:text-indigo-600">Messages</a>
      <a href="/connections" class="hover:text-indigo-600">Connections</a>
      <a href="/notifications" class="hover:text-indigo-600">Notifications</a>
      <a href="/profile" class="hover:text-indigo-600">Profile</a>
      <a href="/settings/location" class="hover:text-indigo-600">Privacy</a>
      <form method="POST" action="/auth/logout" class="inline">
        <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
        <button type="submit" class="hover:text-red-600">Logout</button>
      </form>
    </div>
  </div>
</nav>
{{end}}
