{{define "partials/nav.html"}}
<nav class="fn-nav sticky top-0 z-50 border-b border-[color:var(--fn-border)] bg-[color:var(--fn-bg-elevated)]/90 backdrop-blur-md" x-data="{ open: false }">
  <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between gap-3 relative">
    <a href="/" class="font-bold text-white text-lg shrink-0 tracking-tight">
      <span class="inline-flex items-center justify-center w-8 h-8 mr-2 rounded-md border border-[color:var(--fn-border)] text-sm align-middle">FN</span>FindNeighbour
    </a>

    <button type="button"
      class="sm:hidden inline-flex items-center justify-center w-10 h-10 rounded-lg border border-[color:var(--fn-border)] text-white bg-[color:var(--fn-surface)]"
      @click="open = !open"
      :aria-expanded="open.toString()"
      aria-controls="fn-nav-links"
      aria-label="Toggle menu">
      <span x-show="!open">☰</span>
      <span x-show="open" x-cloak>✕</span>
    </button>

    <div id="fn-nav-links"
      class="sm:flex sm:flex-row sm:static sm:border-0 sm:shadow-none sm:p-0 sm:gap-x-4 sm:items-center flex-wrap justify-end gap-x-4 gap-y-2 text-sm text-slate-300"
      :class="open
        ? 'flex flex-col absolute left-0 right-0 top-full bg-[color:var(--fn-bg-elevated)] border-b border-[color:var(--fn-border)] px-4 py-3 shadow-lg gap-3 items-stretch'
        : 'hidden sm:flex'">
      <a href="/discover" class="hover:text-white py-1 sm:py-0" @click="open = false">Discover</a>
      <a href="/events" class="hover:text-white py-1 sm:py-0" @click="open = false">Events</a>
      <a href="/messages" class="hover:text-white py-1 sm:py-0" @click="open = false">Messages</a>
      <a href="/connections" class="hover:text-white py-1 sm:py-0" @click="open = false">Connections</a>
      <a href="/notifications" class="hover:text-white py-1 sm:py-0" @click="open = false">Notifications</a>
      <a href="/profile" class="hover:text-[color:var(--fn-yellow)] py-1 sm:py-0" @click="open = false">Profile</a>
      <a href="/settings/location" class="hover:text-white py-1 sm:py-0" @click="open = false">Privacy</a>
      <form method="POST" action="/auth/logout" class="sm:inline">
        <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
        <button type="submit" class="fn-btn fn-btn-blue !py-1.5 !px-3 !text-xs w-full sm:w-auto">Logout</button>
      </form>
    </div>
  </div>
</nav>
<style>[x-cloak]{display:none!important}</style>
{{end}}
