{{define "auth/register.html"}}
<!DOCTYPE html>
<html lang="en">
<head>
  {{template "partials/head.html" .}}
  <title>Register · FindNeighbour</title>
</head>
<body class="fn-theme min-h-screen flex items-center justify-center px-4">
  <div class="bg-white p-8 rounded-2xl border w-full max-w-md shadow-[0_0_60px_rgba(59,130,246,0.12)]">
    <h1 class="text-2xl font-bold mb-2 text-white">Create Account</h1>
    <p class="text-sm text-slate-500 mb-6">Create an account to appear on the map and connect.</p>
    {{if .Error}}<p class="text-red-400 mb-4">{{.Error}}</p>{{end}}
    <form method="POST" action="/auth/register" class="space-y-4">
      <input type="hidden" name="next" value="{{.Next}}">
      <div>
        <label class="block text-sm font-medium mb-1 text-slate-300">Full Name</label>
        <input type="text" name="full_name" required class="w-full border rounded-lg px-3 py-2">
      </div>
      <div>
        <label class="block text-sm font-medium mb-1 text-slate-300">Username</label>
        <input type="text" name="username" required pattern="[a-zA-Z0-9_]{3,30}" class="w-full border rounded-lg px-3 py-2">
      </div>
      <div>
        <label class="block text-sm font-medium mb-1 text-slate-300">Email</label>
        <input type="email" name="email" required class="w-full border rounded-lg px-3 py-2">
      </div>
      <div>
        <label class="block text-sm font-medium mb-1 text-slate-300">Password</label>
        <input type="password" name="password" required minlength="8" class="w-full border rounded-lg px-3 py-2">
      </div>
      <button type="submit" class="fn-btn fn-btn-primary w-full">Register</button>
    </form>
    <p class="mt-4 text-sm text-center text-slate-400">
      <a href="/auth/login?next={{.Next}}" class="text-[color:var(--fn-blue-bright)]">Already have an account?</a>
      · <a href="/" class="text-slate-500">Back to map</a>
    </p>
  </div>
</body>
</html>
{{end}}
