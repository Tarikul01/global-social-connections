{{define "notifications/list.html"}}
<!DOCTYPE html>
<html lang="en">
<head>{{template "partials/head.html" .}}</head>
<body class="fn-theme min-h-screen">
{{template "partials/nav.html" .}}
<main class="max-w-6xl mx-auto px-4 py-8">
<h1 class="text-2xl font-bold mb-6">Notifications</h1>
<div class="space-y-2">
  {{range .Notifications}}
  <div class="p-4 bg-white rounded-xl border">
    <div class="font-semibold">{{.Title}}</div>
    <p class="text-sm text-slate-500">{{.Body}}</p>
  </div>
  {{else}}<p class="text-slate-500">No notifications.</p>{{end}}
</div>
</main>
</body>
</html>
{{end}}
