{{define "events/new.html"}}
<!DOCTYPE html>
<html lang="en">
<head>{{template "partials/head.html" .}}</head>
<body class="fn-theme min-h-screen">
{{template "partials/nav.html" .}}
<main class="max-w-6xl mx-auto px-4 py-8">
<h1 class="text-2xl font-bold mb-6">Create Event</h1>
<form method="POST" action="/events" class="bg-white rounded-xl border p-6 space-y-4 max-w-xl">
  <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
  <input type="hidden" name="lat" value="23.8103"><input type="hidden" name="lng" value="90.4125">
  <div><label class="block text-sm mb-1">Title</label><input name="title" required class="w-full border rounded-lg px-3 py-2"></div>
  <div><label class="block text-sm mb-1">Description</label><textarea name="description" rows="3" class="w-full border rounded-lg px-3 py-2"></textarea></div>
  <div><label class="block text-sm mb-1">Date</label><input type="date" name="event_date" required class="w-full border rounded-lg px-3 py-2"></div>
  <div class="grid grid-cols-2 gap-4">
    <div><label class="block text-sm mb-1">Start</label><input type="time" name="start_time" required class="w-full border rounded-lg px-3 py-2"></div>
    <div><label class="block text-sm mb-1">End</label><input type="time" name="end_time" class="w-full border rounded-lg px-3 py-2"></div>
  </div>
  <div><label class="block text-sm mb-1">Location</label><input name="location_name" class="w-full border rounded-lg px-3 py-2"></div>
  <div><label class="block text-sm mb-1">Max Participants</label><input type="number" name="max_participants" value="20" min="1" class="w-full border rounded-lg px-3 py-2"></div>
  <button type="submit" class="bg-indigo-600 text-white px-4 py-2 rounded-lg">Create</button>
</form>
</main>
</body>
</html>
{{end}}
