{{define "events/map.html"}}
<!DOCTYPE html>
<html lang="en">
<head>{{template "partials/head.html" .}}</head>
<body class="bg-slate-50 min-h-screen">
{{template "partials/nav.html" .}}
<main class="max-w-6xl mx-auto px-4 py-8">
<h1 class="text-2xl font-bold mb-4">Event Map · {{.Event.Title}}</h1>
<div id="event-map" class="h-96 rounded-xl border mb-4 z-0"></div>
<label class="flex items-center gap-2 mb-4">
  <input type="checkbox" id="live-consent">
  Share live location with this event
</label>
<input type="hidden" id="csrf" value="{{.CSRFToken}}">
<input type="hidden" id="event-id" value="{{.Event.ID}}">
</main>
<script>
const lat = {{.Event.Latitude}};
const lng = {{.Event.Longitude}};
const map = L.map('event-map').setView([lat || 23.81, lng || 90.41], 14);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19,
  attribution: '&copy; OpenStreetMap'
}).addTo(map);
if (lat && lng) {
  L.marker([lat, lng]).addTo(map).bindPopup({{printf "%q" .Event.Title}});
}
let watchId = null;
document.getElementById('live-consent').addEventListener('change', (e) => {
  const csrf = document.getElementById('csrf').value;
  const eventId = document.getElementById('event-id').value;
  const fd = new FormData();
  fd.append('consented', e.target.checked);
  fd.append('csrf_token', csrf);
  fetch('/events/' + eventId + '/live-consent', { method: 'POST', body: fd });
  if (e.target.checked && navigator.geolocation) {
    watchId = navigator.geolocation.watchPosition((pos) => {
      const lfd = new FormData();
      lfd.append('lat', pos.coords.latitude);
      lfd.append('lng', pos.coords.longitude);
      lfd.append('event_id', eventId);
      lfd.append('csrf_token', csrf);
      fetch('/api/live-location', { method: 'POST', body: lfd });
    }, null, { enableHighAccuracy: true, maximumAge: 30000 });
  } else if (watchId) {
    navigator.geolocation.clearWatch(watchId);
    fetch('/api/live-location?event_id=' + eventId, { method: 'DELETE', headers: {'X-CSRF-Token': csrf} });
  }
});
</script>
</body>
</html>
{{end}}
