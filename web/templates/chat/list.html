{{define "chat/list.html"}}
<!DOCTYPE html>
<html lang="en">
<head>{{template "partials/head.html" .}}</head>
<body class="fn-theme min-h-screen">
{{template "partials/nav.html" .}}
<main class="max-w-6xl mx-auto px-4 py-8">
<h1 class="text-2xl font-bold mb-6">Messages</h1>
<div class="space-y-2">
  {{range .Conversations}}
  <a href="/messages/{{.ID}}" class="block p-4 bg-white rounded-xl border hover:border-indigo-300">
    <div class="font-semibold">{{.OtherName}}</div>
    <div class="text-sm text-slate-500 truncate">{{.LastMessage}}</div>
  </a>
  {{else}}<p class="text-slate-500">No conversations yet. Connect with someone to start chatting.</p>{{end}}
</div>
</main>
</body>
</html>
{{end}}
