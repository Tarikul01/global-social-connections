{{define "landing.html"}}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Discover · FindNeighbour</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <link rel="stylesheet" href="/static/css/app.css">
  <style>
    html, body { height: 100%; margin: 0; overflow: hidden; background: #0f172a; }
    body.fn-has-rail #map {
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      z-index: 0;
    }

    .disc-marker {
      width: 46px; height: 46px; border-radius: 9999px;
      border: 3px solid #fff;
      box-shadow: 0 3px 10px rgba(5, 8, 22, 0.45);
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 700; color: #fff;
      background: #3b82f6;
      overflow: visible;
      cursor: pointer;
      position: relative;
    }
    .disc-marker img {
      width: 100%; height: 100%; object-fit: cover; display: block;
      border-radius: 9999px;
    }
    .disc-marker.online { background: #22c55e; box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.35), 0 3px 10px rgba(5,8,22,.45); }
    .disc-marker.offline { background: #64748b; box-shadow: 0 3px 10px rgba(5, 8, 22, 0.45); }
    .disc-marker.me {
      box-shadow: 0 0 0 3px rgba(250, 204, 21, 0.55), 0 3px 10px rgba(5,8,22,.45);
    }
    .disc-marker.me.online,
    .disc-marker.live {
      background: #22c55e;
    }
    .disc-marker.me.live {
      background: #22c55e !important;
      box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.45), 0 3px 10px rgba(5,8,22,.45) !important;
    }
    .disc-marker .dot {
      position: absolute; right: -2px; bottom: -2px;
      width: 14px; height: 14px; border-radius: 9999px;
      border: 2px solid #fff; background: #22c55e;
      box-shadow: 0 1px 4px rgba(5, 8, 22, 0.35);
      z-index: 2;
      pointer-events: none;
    }
    .disc-marker.online .dot { background: #22c55e; }
    .disc-marker.offline .dot { background: #94a3b8; }
    .disc-marker.live .dot { background: #facc15; }

    .leaflet-marker-icon.leaflet-div-icon {
      overflow: visible !important;
      background: transparent !important;
      border: none !important;
    }

    /* Live sharing — heartbeat pulse on your marker */
    .disc-marker-wrap.is-live-sharing {
      position: relative;
      width: 46px;
      height: 46px;
      overflow: visible;
    }
    .disc-marker-wrap.is-live-sharing .disc-marker {
      position: relative;
      z-index: 3;
      overflow: visible;
      animation: disc-heartbeat 1.6s ease-in-out infinite;
    }
    .disc-marker-wrap.is-live-sharing .live-ring {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 46px;
      height: 46px;
      margin: -23px 0 0 -23px;
      border-radius: 9999px;
      border: 2px solid rgba(34, 197, 94, 0.7);
      pointer-events: none;
      z-index: 1;
      animation: disc-live-ring 1.6s ease-out infinite;
    }
    .disc-marker-wrap.is-live-sharing .live-ring--b {
      animation-delay: 0.32s;
      border-color: rgba(250, 204, 21, 0.55);
    }
    @keyframes disc-heartbeat {
      0%, 100% { transform: scale(1); box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.35), 0 3px 10px rgba(5,8,22,.45); }
      12% { transform: scale(1.14); box-shadow: 0 0 0 6px rgba(34, 197, 94, 0.55), 0 3px 14px rgba(34,197,94,.35); }
      24% { transform: scale(1); box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.35), 0 3px 10px rgba(5,8,22,.45); }
      36% { transform: scale(1.09); box-shadow: 0 0 0 5px rgba(250, 204, 21, 0.45), 0 3px 12px rgba(250,204,21,.25); }
      52% { transform: scale(1); }
      72% { transform: scale(1.03); }
      88% { transform: scale(1); }
    }
    @keyframes disc-live-ring {
      0% { transform: scale(0.85); opacity: 0.85; }
      45% { transform: scale(1.35); opacity: 0.45; }
      100% { transform: scale(2.4); opacity: 0; }
    }

    .disc-btn.is-live-sharing {
      animation: disc-heartbeat-btn 1.6s ease-in-out infinite;
      background: #22c55e !important;
      box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.55), 0 6px 18px rgba(34, 197, 94, 0.45) !important;
    }
    @keyframes disc-heartbeat-btn {
      0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.5), 0 6px 18px rgba(34, 197, 94, 0.4); }
      14% { transform: scale(1.1); box-shadow: 0 0 0 8px rgba(34, 197, 94, 0.15), 0 6px 22px rgba(34, 197, 94, 0.55); }
      28% { transform: scale(1); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.4), 0 6px 18px rgba(34, 197, 94, 0.4); }
      40% { transform: scale(1.06); box-shadow: 0 0 0 5px rgba(250, 204, 21, 0.2), 0 6px 20px rgba(250, 204, 21, 0.35); }
      55% { transform: scale(1); }
    }

    .disc-controls {
      position: absolute;
      top: 1rem;
      right: 1rem;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
    }
    .disc-btn {
      width: 2.75rem;
      height: 2.75rem;
      border-radius: 9999px;
      border: none;
      background: #3b82f6;
      color: #fff;
      box-shadow: 0 6px 18px rgba(59, 130, 246, 0.4);
      font-size: 1.15rem;
      line-height: 1;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: background .2s ease, transform .15s ease;
    }
    .disc-btn:hover { background: #2563eb; }
    .disc-btn.is-active { background: #facc15; color: #0f172a; box-shadow: 0 0 0 3px rgba(250,204,21,.4); }
    .disc-btn.is-locating { animation: pulse-btn 1s ease infinite; }
    @keyframes pulse-btn { 50% { transform: scale(1.08); background: #60a5fa; } }

    .disc-panel {
      position: absolute;
      right: 1rem;
      top: 12rem;
      bottom: 1rem;
      width: min(340px, calc(100vw - 2rem));
      background: rgba(15, 23, 42, 0.92);
      color: #fff;
      border-radius: 1.1rem;
      backdrop-filter: blur(12px);
      box-shadow: 0 16px 40px rgba(0,0,0,.35);
      z-index: 1000;
      display: none;
      flex-direction: column;
      overflow: hidden;
    }
    .disc-panel.is-open { display: flex; }
    .disc-panel-head {
      padding: 0.9rem 1rem;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }
    .disc-panel-head input, .disc-panel-head select {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 0.7rem;
      color: #fff;
      padding: 0.45rem 0.65rem;
      font-size: 0.8rem;
      outline: none;
    }
    .disc-panel-head input { flex: 1; min-width: 0; }
    .disc-panel-close {
      flex-shrink: 0;
      width: 2rem;
      height: 2rem;
      border: 0;
      border-radius: 999px;
      background: rgba(255,255,255,0.1);
      color: #fff;
      font-size: 1rem;
      line-height: 1;
      cursor: pointer;
    }
    .disc-panel-close:hover { background: rgba(255,255,255,0.18); }
    #people-list { flex: 1; overflow-y: auto; padding: 0.65rem; }
    .leaflet-control-attribution { font-size: 10px; }
    body.is-map-expanded .disc-panel { opacity: 0; pointer-events: none; }
  </style>
</head>
<body class="fn-has-rail">
  {{template "partials/nav.html" .}}
  <div id="map"></div>

  <div class="disc-controls" aria-label="Map controls">
    {{if .LoggedIn}}
    <button type="button" class="disc-btn" id="live-toggle" data-on="{{if .LiveOn}}1{{else}}0{{end}}" title="Share live location">📍</button>
    {{end}}
    <button type="button" class="disc-btn" id="zoom-in" title="Zoom in">+</button>
    <button type="button" class="disc-btn" id="zoom-out" title="Zoom out">−</button>
    <button type="button" class="disc-btn" id="expand-map" title="Expand map">⛶</button>
    <button type="button" class="disc-btn" id="locate-me" title="Go to saved profile location">◎</button>
    <button type="button" class="disc-btn" id="toggle-people" title="People nearby">👤</button>
  </div>

  <aside class="disc-panel" id="people-panel" aria-label="People nearby">
    <div class="disc-panel-head">
      <input id="search" type="search" placeholder="Search people...">
      <select id="status-filter">
        <option value="">All</option>
        <option value="online">Online</option>
        <option value="offline">Offline</option>
      </select>
      <button type="button" class="disc-panel-close" id="people-panel-close" title="Close" aria-label="Close people list">✕</button>
    </div>
    <div id="people-list"></div>
    <div style="padding:.65rem 1rem;font-size:.72rem;opacity:.65;border-top:1px solid rgba(255,255,255,.08)">
      <span id="footer-stats">{{.TotalPeople}} people worldwide</span>
      · <span id="online-count">{{.OnlinePeople}}</span> online
      · <span id="people-count" class="sr-only">{{.TotalPeople}}</span>
    </div>
  </aside>

  <script>
    window.FN_MAP = {
      loggedIn: {{if .LoggedIn}}true{{else}}false{{end}},
      csrf: {{if .CSRFToken}}"{{.CSRFToken}}"{{else}}""{{end}},
      liveOn: {{if .LiveOn}}true{{else}}false{{end}},
      total: {{.TotalPeople}},
      online: {{.OnlinePeople}},
      myLat: {{if .HasMyLoc}}{{printf "%.7f" .MyLat}}{{else}}null{{end}},
      myLng: {{if .HasMyLoc}}{{printf "%.7f" .MyLng}}{{else}}null{{end}}
    };
  </script>
  <script src="/static/js/map-home.js"></script>
  {{if .LoggedIn}}<script src="/static/js/live-location.js"></script>{{end}}
</body>
</html>
{{end}}
