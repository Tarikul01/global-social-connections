services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: findneighbour
      POSTGRES_PASSWORD: findneighbour
      POSTGRES_DB: findneighbour
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations/001_initial_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql

volumes:
  pgdata:
